<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Sin red ni nada externo: solo corre el script y se aplica el estilo que llevan el nonce de abajo (ventana.py pone uno nuevo en cada arranque), así que un script o un estilo
     que se colara en el contenido de la página no se ejecutaría. connect-src, img-src, frame-src... caen en default-src 'none' -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-__NONCE__'; style-src 'nonce-__NONCE__'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Argos</title>
<style nonce="__NONCE__">
  /* Estilo inspirado en Windows XP (tema azul «Luna») hecho a mano, sin librerías ni imágenes: la CSP no deja cargar nada, así que el cielo y la pradera del fondo son
     degradados, los iconos son formas CSS (o caracteres Unicode) y las barras de bloques, un degradado repetido. Lo que se mide en JS (el ancho de una barra) se pone con
     style.width: la CSP no bloquea el CSSOM, solo el atributo style="..." */
  :root {
    color-scheme: light; /* Windows XP no tenía modo oscuro */
    --marco: #0831d9;
    --beige: #ece9d8;
    --grupo: #f6f5ef;
    --borde-grupo: #d0d0bf;
    --titulo-grupo: #0046d5;
    --borde-boton: #003c74;
    --resalte: #f8b33a; /* el naranja del ratón encima y de la pestaña activa */
    --campo: #7f9db9;
    --borde-pestana: #919b9c;
    --bloque: #2bd23a;
    --seleccion: #316ac5;
    --alarma: #c00;
    --limpio: #2a7d1e;
    --apagado: #808080;
    --azul-titulo: linear-gradient(#0997ff 0%, #0053ee 10%, #0050ee 50%, #06f 90%, #0050ee 100%);
    --fuente: Tahoma, "Segoe UI", sans-serif;
    --fuente-titulo: "Trebuchet MS", Tahoma, sans-serif;
    --fija: "Lucida Console", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    padding: clamp(8px, 2.4vw, 28px);
    color: #000;
    font: 12px/1.4 var(--fuente);
    cursor: default;
    /* El escritorio: de arriba abajo, nubes, cielo y dos lomas de pradera. Solo degradados (nada de la foto de Windows: tiene derechos) */
    background:
      radial-gradient(ellipse 22% 7% at 22% 17%, rgba(255, 255, 255, .6), transparent),
      radial-gradient(ellipse 16% 5% at 74% 11%, rgba(255, 255, 255, .5), transparent),
      radial-gradient(ellipse 75% 36% at 12% 104%, #6cc247 0 96%, transparent 100%),
      radial-gradient(ellipse 85% 30% at 92% 108%, #3f9a2b 0 96%, transparent 100%),
      linear-gradient(#2f6fd6 0%, #77aef0 50%, #a9cdf3 66%, #5fa840 67%, #3d8a2a 100%);
  }
  body.ocupado { cursor: progress; } /* el reloj de arena, mientras capa trabaja */
  ::selection { background: var(--seleccion); color: #fff; }
  p { margin: 0; }

  /* La ventana de dentro de la página: marco azul de 3 px, esquinas de arriba redondeadas y la barra de título encima del marco. El marco de verdad es el de Windows 11 */
  .ventana {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border: 3px solid var(--marco);
    border-top: 0;
    border-radius: 8px 8px 0 0;
    background: var(--beige);
    background-clip: padding-box;
    box-shadow: 2px 3px 12px rgba(0, 0, 0, .45);
  }
  .titulo {
    flex: none;
    display: flex;
    align-items: center;
    height: 30px;
    margin: 0 -3px; /* tapa el marco de los lados: la barra va de borde a borde */
    padding: 0 6px 0 10px;
    border-radius: 8px 8px 0 0;
    color: #fff;
    font: 700 13px var(--fuente-titulo);
    text-shadow: 1px 1px #0f1089;
    background: var(--azul-titulo);
    user-select: none;
  }
  .titulo h1 { flex: 1; min-width: 0; margin: 0; overflow: hidden; font: inherit; white-space: nowrap; text-overflow: ellipsis; }
  /* _ □ × solo de adorno: no son botones y no hacen nada */
  .bt {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 21px;
    height: 21px;
    margin-left: 2px;
    border: 1px solid #fff;
    border-radius: 3px;
    font: 700 12px/1 Tahoma, sans-serif;
    text-shadow: none;
    background: linear-gradient(#3c81f3, #2463d6);
  }
  .bt.cerrar { background: linear-gradient(#e67256, #c73b1c); }
  .interior { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .cuerpo { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 6px; overflow: auto; }

  fieldset { margin: 0; min-width: 0; padding: 8px 10px 10px; border: 1px solid var(--borde-grupo); border-radius: 4px; background: var(--grupo); }
  legend { padding: 0 4px; color: var(--titulo-grupo); }
  .hundido { background: #fff; border: 1px solid var(--campo); }
  .apagado { color: var(--apagado); }
  .alarma { color: var(--alarma); font-weight: 700; }
  .limpio { color: var(--limpio); }

  button {
    font: inherit;
    min-width: 75px;
    min-height: 23px;
    padding: 3px 14px;
    border: 1px solid var(--borde-boton);
    border-radius: 3px;
    color: #000;
    background: linear-gradient(#fff, #ecebe6 85%, #d6d0c5);
    cursor: inherit;
  }
  button:hover:not(:disabled) { box-shadow: inset 0 0 0 1px #fff0cf, inset 0 0 0 2px var(--resalte); }
  button:active:not(:disabled) { padding: 4px 13px 2px 15px; background: linear-gradient(#cdcac3, #e3e3db 20%, #e5e5de); box-shadow: inset 1px 1px 2px rgba(0, 0, 0, .3); }
  button.principal { font-weight: 700; box-shadow: inset 0 0 0 2px #7ba2e7; } /* el botón por defecto lleva un borde azul por dentro */
  button.principal:hover:not(:disabled) { box-shadow: inset 0 0 0 1px #fff0cf, inset 0 0 0 2px var(--resalte); }
  button.principal:active:not(:disabled) { box-shadow: inset 1px 1px 2px rgba(0, 0, 0, .3); }
  button:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
  button:disabled { color: #acaa9f; border-color: #c9c7ba; background: #f4f4ee; box-shadow: none; }
  .botones { display: flex; flex-wrap: wrap; gap: 6px; }
  input[type="password"] { font: inherit; width: 16em; max-width: 100%; padding: 3px 5px; border: 1px solid var(--campo); border-radius: 0; color: #000; background: #fff; }
  input[type="password"]:focus-visible { outline: 1px solid var(--seleccion); outline-offset: -2px; }
  input:disabled { color: #acaa9f; background: #f4f4ee; border-color: #c9c7ba; }
  .ayuda { color: #555; }

  /* La casilla se dibuja a mano: la marca es un par de bordes girados (sin imágenes) */
  .casilla { display: flex; align-items: center; gap: 6px; }
  .casilla input { appearance: none; position: relative; flex: none; width: 13px; height: 13px; margin: 0; border: 1px solid #1c5180; border-radius: 2px; background: linear-gradient(135deg, #dcdcd7, #fff 80%); }
  .casilla input:hover:not(:disabled) { box-shadow: inset 0 0 0 1px #f8c666; }
  .casilla input:checked::after { content: ""; position: absolute; left: 3px; top: 0; width: 3px; height: 7px; border: solid #21a121; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .casilla input:disabled { border-color: #c9c7ba; background: #f4f4ee; }
  .casilla input:disabled:checked::after { border-color: #acaa9f; }
  .casilla:has(input:focus-visible) span { outline: 1px dotted #000; }

  /* Soltar o elegir: la zona entera (los dos grupos) recibe el soltar */
  #zona { display: flex; flex-direction: column; gap: 10px; }
  #zona .soltar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .caja-soltar { flex: 1 1 14em; display: flex; align-items: center; justify-content: center; min-height: 34px; padding: 4px 10px; border: 1px dashed var(--campo); border-radius: 3px; background: #fff; color: #6d6d6d; }
  #zona.sobre .caja-soltar { color: #fff; background: var(--seleccion); border-style: solid; border-color: var(--borde-boton); }
  #elegido { display: flex; flex-direction: column; gap: 6px; }
  #nombre { overflow-wrap: anywhere; }
  #tamano { color: var(--apagado); }
  .acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  #campo-clave { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
  .acciones .botones { margin-left: auto; }
  #elegido:has(#campo-clave[hidden]) .ayuda { display: none; }

  /* Progreso del análisis y de la actualización: la barra de XP, bloques verdes separados dentro de un marco redondeado */
  #avance, #actualizacion { display: flex; flex-direction: column; gap: 6px; }
  .barra { height: 18px; padding: 2px; border: 1px solid #686868; border-radius: 3px; background: #fff; }
  .relleno {
    height: 100%;
    width: 0;
    border-radius: 2px;
    background:
      repeating-linear-gradient(90deg, transparent 0 8px, #fff 8px 10px),
      linear-gradient(#b4f5ba 0%, var(--bloque) 45%, #1fb82e 60%, #62e06e 100%);
  }
  #actividad, #actividad-actualiza { overflow-wrap: anywhere; }

  /* El informe: pestañas (una por fichero de un zip) y, debajo, la página */
  #informe { flex: 1 0 14em; min-height: 0; display: flex; flex-direction: column; }
  #pestanas { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 2px; padding: 0 4px; }
  button.pestana {
    min-width: 0;
    max-width: 16em;
    min-height: 0;
    margin: 2px 0 0;
    padding: 3px 12px 2px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    border: 1px solid var(--borde-pestana);
    border-bottom: 0;
    border-radius: 3px 3px 0 0;
    background: linear-gradient(#fff, #f2f1ea 80%, #e6e3d6);
  }
  button.pestana:hover:not(:disabled):not([aria-selected="true"]) { box-shadow: inset 0 2px 0 var(--resalte); }
  button.pestana:active:not(:disabled):not([aria-selected="true"]) { padding: 3px 12px 2px; background: linear-gradient(#fff, #f2f1ea 80%, #e6e3d6); box-shadow: inset 0 2px 0 var(--resalte); }
  button.pestana[aria-selected="true"] { margin: 0 0 -1px; padding: 5px 12px 4px; background: #fcfcfe; box-shadow: inset 0 3px 0 var(--resalte); }
  button.pestana:focus-visible { outline-offset: -4px; }
  #paneles { flex: 1; min-height: 0; overflow: auto; padding: 10px; border: 1px solid var(--borde-pestana); border-radius: 0 3px 3px 3px; background: linear-gradient(#fcfcfe, #f4f3ee); }
  .vacio { padding: 4px; }
  .informe-fichero { display: flex; flex-direction: column; gap: 10px; }
  .nombre-fichero { margin: 0; color: var(--titulo-grupo); font: 700 13px var(--fuente-titulo); overflow-wrap: anywhere; }
  .bloque { display: contents; }
  .filas { display: flex; flex-direction: column; gap: 3px; }
  .fila { display: grid; grid-template-columns: 11em minmax(0, 1fr); gap: 0 8px; }
  .etq { color: #333; overflow-wrap: anywhere; }
  .val { min-width: 0; overflow-wrap: anywhere; }
  .huella { font: 11px/1.4 var(--fija); user-select: all; } /* un clic selecciona la huella entera: navigator.clipboard no existe en esta página (ver el script) */

  /* El resumen de señales: un aviso amarillo con un icono redondo. El icono es un ::before (así no entra en el texto de la caja) y su forma depende del titular de dentro:
     rojo con «!» si hay señales, verde con «✓» si no, y gris con «?» si el resumen no se pudo pintar */
  .resumen-fichero { display: flex; align-items: flex-start; gap: 14px; padding: 8px 10px; border: 1px solid #e5c365; border-radius: 4px; background: #fff7d6; }
  .resumen-fichero::before {
    content: "?";
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    color: #fff;
    font: 700 18px/1 "Segoe UI Symbol", "Segoe UI", Tahoma, sans-serif;
    background: radial-gradient(circle at 35% 28%, #c9c9c9, #808080 60%, #5c5c5c);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .8), 0 1px 2px rgba(0, 0, 0, .4);
  }
  .resumen-fichero:has(.titular.alarma)::before { content: "!"; background: radial-gradient(circle at 35% 28%, #ff8a80, #d11 60%, #8c0000); }
  .resumen-fichero:has(.titular.limpio)::before { content: "✓"; background: radial-gradient(circle at 35% 28%, #8ee37d, #2a9d1e 60%, #17690f); }
  .resumen-texto { flex: 1; min-width: 0; }
  .titular { font-size: 13px; font-weight: 700; }
  .senales, .sin-comprobar { margin: 2px 0; padding-left: 20px; }
  .nota { margin-top: 6px; color: #555; }
  .ember-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; margin-top: 6px; }
  .pista-ember { flex: 0 0 14em; height: 16px; padding: 2px; border: 1px solid #686868; border-radius: 3px; }
  .pista-ember .relleno { background: repeating-linear-gradient(90deg, transparent 0 6px, #fff 6px 8px), linear-gradient(#b4f5ba 0%, var(--bloque) 45%, #1fb82e 60%, #62e06e 100%); }
  .lista { max-height: 14em; margin: 3px 0 0; padding: 3px 6px; overflow: auto; list-style: none; }
  .lista li { overflow-wrap: anywhere; }
  .tecnica { color: #555; }
  .tabla-caja { margin-top: 3px; overflow-x: auto; }
  /* Como la vista de detalles del Explorador de XP: cabecera con degradado y separadores, filas sin rejilla */
  .tabla { border-collapse: collapse; width: 100%; }
  .tabla th { padding: 2px 8px; font-weight: 400; text-align: left; border-right: 1px solid #d6d2c2; border-bottom: 2px solid #d6d2c2; background: linear-gradient(#fff, #ebeadb); }
  .tabla td { padding: 2px 8px; white-space: nowrap; }
  .tabla .der { text-align: right; }
  .tabla .alta { color: var(--alarma); font-weight: 700; }
  .funciones { padding: 2px 0 4px 17px; overflow-wrap: anywhere; }
  /* Plegables al estilo del explorador: un cuadrito con + o − */
  details > summary { display: flex; gap: 6px; align-items: center; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before {
    content: "+";
    flex: none;
    width: 11px;
    height: 11px;
    border: 1px solid var(--borde-pestana);
    border-radius: 2px;
    font: 700 11px/9px var(--fija);
    text-align: center;
    background: linear-gradient(135deg, #fff, #dedbd0);
  }
  details[open] > summary::before { content: "−"; }
  details > summary:focus-visible { outline: 1px dotted #000; }
  details .lista, details .tabla-caja { margin-left: 17px; }

  /* La barra de estado de abajo: el resumen de una línea y la versión, con las divisiones en relieve */
  .estado-barra { flex: none; display: flex; border-top: 1px solid #fff; box-shadow: 0 -1px #c5c2b2; }
  .estado-barra > * { min-height: 22px; padding: 3px 8px; }
  #resumen { flex: 1; min-width: 0; overflow-wrap: anywhere; border-right: 1px solid #c5c2b2; box-shadow: 1px 0 #fff; }
  #pie { flex: none; }

  /* Los avisos (rechazado, aviso y error) son un cuadro de mensaje de XP dentro de la página, no un diálogo del navegador: mientras está abierto el resto de la ventana no se puede tocar
     (inert, lo pone el script) y hay que pulsar «Aceptar». El velo solo cubre debajo de la barra de título */
  #aviso { position: absolute; z-index: 10; inset: 30px 0 0; display: flex; align-items: center; justify-content: center; padding: 12px; background: rgba(0, 0, 40, .12); }
  .cuadro {
    display: flex;
    flex-direction: column;
    width: min(380px, 100%);
    max-height: 100%;
    border: 3px solid var(--marco);
    border-top: 0;
    border-radius: 8px 8px 0 0;
    background: var(--beige);
    box-shadow: 2px 3px 12px rgba(0, 0, 0, .5);
  }
  .cuadro-titulo { flex: none; display: flex; align-items: center; height: 26px; margin: 0 -3px; padding: 0 8px; border-radius: 8px 8px 0 0; color: #fff; font: 700 12px var(--fuente-titulo); text-shadow: 1px 1px #0f1089; background: var(--azul-titulo); user-select: none; }
  .cuadro-cuerpo { display: flex; align-items: center; gap: 14px; padding: 16px 16px 10px; overflow: auto; }
  .cuadro-icono {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    color: #fff;
    font: 700 22px/1 var(--fuente-titulo);
    background: radial-gradient(circle at 35% 28%, #9bc8ff, #2a6fd6 58%, #0a3fa8);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .85), 0 1px 2px rgba(0, 0, 0, .45);
  }
  .cuadro-icono::before { content: "i"; }
  #aviso.rechazado .cuadro-icono { color: #5a3b00; background: radial-gradient(circle at 35% 28%, #fff1a6, #f2c400 58%, #c28a00); }
  #aviso.rechazado .cuadro-icono::before { content: "!"; }
  #aviso.error .cuadro-icono { background: radial-gradient(circle at 35% 28%, #ff9a8f, #d11 58%, #8c0000); }
  #aviso.error .cuadro-icono::before { content: "×"; }
  #aviso-texto { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .cuadro-botones { display: flex; justify-content: center; padding: 4px 16px 14px; }

  /* En una ventana baja (el mínimo es 560×420) el informe no cabe dentro de lo que queda debajo de los controles: se desplaza todo junto, como un documento */
  @media (max-height: 520px) {
    #informe { flex: none; }
    #paneles { overflow: visible; }
    .ayuda { display: none; }
  }

  /* Barras de desplazamiento al estilo Luna: el carril claro, el cursor y los botones en azul con las esquinas redondeadas, y las flechas, un degradado */
  ::-webkit-scrollbar { width: 16px; height: 16px; }
  ::-webkit-scrollbar-track:vertical { background: linear-gradient(90deg, #f1efe2, #fcfcf9 50%, #f1efe2); }
  ::-webkit-scrollbar-track:horizontal { background: linear-gradient(#f1efe2, #fcfcf9 50%, #f1efe2); }
  ::-webkit-scrollbar-thumb { border: 1px solid #7f9cdc; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:vertical { background: linear-gradient(90deg, #cadafd, #b5c8f8 45%, #a3b9f1); }
  ::-webkit-scrollbar-thumb:horizontal { background: linear-gradient(#cadafd, #b5c8f8 45%, #a3b9f1); }
  ::-webkit-scrollbar-corner { background: var(--beige); }
  ::-webkit-scrollbar-button:single-button { display: block; width: 16px; height: 16px; border: 1px solid #7f9cdc; border-radius: 3px; background-color: #c3d4fb; }
  ::-webkit-scrollbar-button:single-button:vertical:decrement { background: conic-gradient(from 135deg at 50% 0, #4d6185 90deg, transparent 0) 3px 4px / 8px 4px no-repeat, linear-gradient(90deg, #cadafd, #a3b9f1); }
  ::-webkit-scrollbar-button:single-button:vertical:increment { background: conic-gradient(from -45deg at 50% 100%, #4d6185 90deg, transparent 0) 3px 5px / 8px 4px no-repeat, linear-gradient(90deg, #cadafd, #a3b9f1); }
  ::-webkit-scrollbar-button:single-button:horizontal:decrement { background: conic-gradient(from 45deg at 100% 50%, #4d6185 90deg, transparent 0) 4px 3px / 4px 8px no-repeat, linear-gradient(#cadafd, #a3b9f1); }
  ::-webkit-scrollbar-button:single-button:horizontal:increment { background: conic-gradient(from 225deg at 0 50%, #4d6185 90deg, transparent 0) 5px 3px / 4px 8px no-repeat, linear-gradient(#cadafd, #a3b9f1); }
</style>
</head>
<body>
<div class="ventana" id="ventana">
  <!-- La barra de título es solo decorativa: ni los tres botones son botones ni hacen nada. El marco de verdad es el de Windows 11 -->
  <div class="titulo">
    <h1>Argos — Analizador local de ficheros sospechosos</h1>
    <span class="bt" aria-hidden="true">_</span><span class="bt" aria-hidden="true">□</span><span class="bt cerrar" aria-hidden="true">×</span>
  </div>
  <div class="interior">
    <div class="cuerpo">
      <div id="zona">
        <fieldset>
          <legend>Fichero</legend>
          <div class="soltar">
            <div class="caja-soltar">Arrastra aquí un fichero</div>
            <!-- Los botones de esta fila se alinean solos: otro botón (type="button") cabe aquí sin tocar el estilo -->
            <div class="botones" id="botones-zona"><button id="elegir" type="button" disabled>Elegir fichero…</button><button id="actualizar" type="button" disabled>Actualizar</button></div>
            <label class="casilla"><input id="sincircl" type="checkbox"><span>Sin CIRCL (1 GB)</span></label>
          </div>
        </fieldset>
        <fieldset id="elegido" hidden>
          <legend>Fichero elegido</legend>
          <p><strong id="nombre"></strong> <span id="tamano"></span></p>
          <div class="acciones">
            <div id="campo-clave" hidden>
              <label for="clave">Contraseña del zip:</label>
              <input id="clave" type="password" maxlength="256" autocomplete="off" spellcheck="false">
            </div>
            <label class="casilla"><input id="sinred" type="checkbox" role="switch"><span>Sin red (no consultar la huella en línea)</span></label>
            <div class="botones"><button id="analizar" class="principal" type="button">Analizar</button></div>
          </div>
          <p class="ayuda">Los zips de MalwareBazaar usan «infected». Vacía, se analiza el zip como un fichero más.</p>
        </fieldset>
      </div>
      <fieldset id="actualizacion" hidden>
        <legend>Actualización de datos</legend>
        <p id="actividad-actualiza"></p>
        <div class="barra" role="progressbar" aria-label="Progreso de la actualización"><div class="relleno" id="relleno-actualiza"></div></div>
      </fieldset>
      <fieldset id="avance" hidden>
        <legend>Análisis en curso</legend>
        <p id="actividad"></p>
        <div class="barra" role="progressbar" aria-label="Progreso del análisis"><div class="relleno" id="relleno"></div></div>
      </fieldset>
      <section id="informe" aria-label="Informe">
        <div id="pestanas" role="tablist" hidden></div>
        <div id="paneles"></div>
      </section>
    </div>
    <div class="estado-barra">
      <p id="resumen" role="status" aria-live="polite">Listo</p>
      <p id="pie">Versión: …</p>
    </div>
  </div>
  <div id="aviso" hidden>
    <div class="cuadro" role="alertdialog" aria-modal="true" aria-labelledby="aviso-titulo" aria-describedby="aviso-texto">
      <div class="cuadro-titulo" id="aviso-titulo"></div>
      <div class="cuadro-cuerpo">
        <span class="cuadro-icono" aria-hidden="true"></span>
        <p id="aviso-texto"></p>
      </div>
      <div class="cuadro-botones"><button id="aviso-aceptar" class="principal" type="button">Aceptar</button></div>
    </div>
  </div>
</div>
<script nonce="__NONCE__">
  // Todo lo que llega de fuera (nombres dentro de un zip, empresa y firmante de un PE, reglas YARA, detalles de los servicios, capacidades, DLL, funciones...) es del atacante o de un
  // tercero. Se pinta SOLO con createElement y textContent/append de cadenas, que entran como texto: en esta página no hay ningún camino que convierta un texto en elementos
  const $ = (id) => document.getElementById(id);
  const zona = $("zona"), pie = $("pie"), estadoBarra = $("resumen"), actividad = $("actividad"), relleno = $("relleno");
  const botonElegir = $("elegir"), botonAnalizar = $("analizar"), clave = $("clave"), sinRed = $("sinred");
  const botonActualizar = $("actualizar"), sinCircl = $("sincircl");
  const actualizacion = $("actualizacion"), rellenoActualiza = $("relleno-actualiza"), actividadActualiza = $("actividad-actualiza");
  const CONTROLES = [botonElegir, botonAnalizar, botonActualizar, clave, sinRed, sinCircl];
  const pestanas = $("pestanas"), paneles = $("paneles");
  // El mismo valor que estatico.ENTROPIA_ALTA: una sección por encima parece comprimida o cifrada (test_ventana.py comprueba que coinciden)
  const ENTROPIA_ALTA = 7;

  const ETIQUETAS = {
    identificacion: "Identificación (huellas y tipo)",
    en_linea: "Consulta en línea de la huella",
    pe: "Cabeceras PE",
    firma: "Firma digital",
    suplantacion: "Suplantación",
    defender: "Microsoft Defender",
    yara: "Reglas YARA",
    ember: "EMBER2024 (puntuación)",
    die: "Detect It Easy",
    capa: "capa (capacidades, tarda 1-2 min)",
  };
  let partes = [];       // las partes de cada fichero, en el orden en que llegan (las manda Python al empezar)
  let ficheros = [];     // por índice (un fichero suelto o cada miembro de un zip): { nombre, datos: {parte: valor}, llegadas: Set, panel, pestana, bloques: [...] }
  let enCurso = null;    // { fichero, parte, desde }: la parte que se está calculando (siempre la primera que falta, porque llegan en orden)
  let temporizador = null;

  // Los caracteres bidi de control (U+202A-202E, U+2066-2069) reordenan lo que se ve de un nombre («factura‮gpj.exe» se vería «facturaexe.jpg»): salen escritos, como hace la terminal
  const limpiar = (valor) => String(valor).replace(/[‪-‮⁦-⁩]/g, (c) => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
  // Un elemento con su contenido: los nodos entran tal cual y lo demás (cadenas, números) como TEXTO
  function el(etiqueta, clase, ...contenido) {
    const nodo = document.createElement(etiqueta);
    if (clase) nodo.className = clase;
    for (const c of contenido) {
      if (c === null || c === undefined || c === false) continue;
      nodo.append(c instanceof Node ? c : limpiar(c));
    }
    return nodo;
  }
  const fila = (etiqueta, ...valor) => el("div", "fila", el("span", "etq", etiqueta), el("span", "val", ...valor));
  const apagado = (texto) => el("span", "apagado", texto);
  const pendiente = () => apagado("pendiente…");
  const noPE = () => apagado("no es un ejecutable de Windows");
  const miles = (n) => Number(n).toLocaleString("es-ES", { useGrouping: "always" });
  const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
  const hay = (f, ...ps) => ps.every((p) => f.llegadas.has(p));

  function tamano(bytes) {
    const unidades = ["bytes", "KB", "MB", "GB"];
    let n = bytes, i = 0;
    while (n >= 1024 && i < unidades.length - 1) { n /= 1024; i++; }
    const cifra = n.toLocaleString("es-ES", { maximumFractionDigits: i ? 1 : 0 });
    return i ? `${cifra} ${unidades[i]} (${miles(bytes)} bytes)` : `${cifra} bytes`;
  }

  // --- Avisos (rechazado, aviso y error): un cuadro de mensaje de XP dentro de la página (no un diálogo del navegador), con su botón «Aceptar».
  // Mientras está abierto lo de detrás se queda inert (ni ratón ni teclado) como en un cuadro modal; Escape o Aceptar lo cierran, y un mensaje nuevo (elegir otro fichero,
  // empezar un análisis) lo cierra solo. El texto entra con textContent: es de Python, pero lleva nombres de fichero y detalles de servicios ---
  const aviso = $("aviso"), avisoTitulo = $("aviso-titulo"), avisoTexto = $("aviso-texto"), avisoAceptar = $("aviso-aceptar");
  const FONDO_DEL_AVISO = document.querySelectorAll(".cuerpo, .estado-barra");
  const TITULOS_AVISO = { rechazado: "Argos", aviso: "Argos", error: "Argos — Error" };  // la clase del cuadro es el tipo: ella elige el icono (aviso amarillo, información o error)
  let focoAnterior = null;

  function mostrarAviso(tipo, texto) {
    if (aviso.hidden) focoAnterior = document.activeElement;  // con uno ya abierto, el foco que hay que devolver sigue siendo el de antes
    aviso.className = Object.hasOwn(TITULOS_AVISO, tipo) ? tipo : "aviso";
    avisoTitulo.textContent = TITULOS_AVISO[aviso.className];
    avisoTexto.textContent = limpiar(texto);
    aviso.hidden = false;
    for (const zona of FONDO_DEL_AVISO) zona.inert = true;
    avisoAceptar.focus();
  }

  function ocultarAviso() {
    if (aviso.hidden) return;
    aviso.hidden = true;
    aviso.className = "";
    avisoTexto.textContent = "";
    for (const zona of FONDO_DEL_AVISO) zona.inert = false;
    if (focoAnterior && focoAnterior.isConnected && !focoAnterior.disabled) focoAnterior.focus();
    focoAnterior = null;
  }

  avisoAceptar.addEventListener("click", ocultarAviso);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") ocultarAviso(); });

  // --- Lo que dice cada parte del análisis (los mismos textos que la terminal: argos/__main__.py) ---
  const claseEstado = (estado) => (estado === "malware" || estado === "DETECTADO" ? "alarma" : ["sin clave", "límite", "error", "omitido", "no disponible", "no aplica", "no aplicado", "tiempo agotado"].includes(estado) ? "apagado" : "");

  function listaLocal(resultado, verbo, siEsta, siNoEsta) {
    if (resultado === null) return apagado("no disponible (ejecuta «argos actualiza»)");
    const [esta, fecha] = resultado;
    return el("span", null, `${verbo} ${fecha}: `, esta ? siEsta : siNoEsta);
  }

  function herramienta(r, texto) {
    if (r.estado === "ok") return texto(r);
    if (r.estado === "no disponible") return apagado("no disponible (ejecuta «argos actualiza»)");
    return apagado(r.estado + (r.detalle ? `: ${r.detalle}` : ""));
  }

  const textoDie = (r) => Object.entries(r.detectado).filter(([, valores]) => valores.length).map(([etiqueta, valores]) => `${etiqueta}: ${valores.join(", ")}`).join("; ") || "no detecta compilador, lenguaje ni empaquetador";
  // Sin umbral a propósito: decir «sospechoso» a partir de un número sin haber medido sus falsos positivos sería inventárselo (se calibra en el hito 7)
  const textoEmber = (r) => `${r.puntuacion.toFixed(2).replace(".", ",")} (0 = parece legítimo, 1 = parece malware; umbral sin calibrar hasta el hito 7)`;

  function capacidades(r) {
    const c = r.capacidades;
    if (!c.length) return "ninguna";
    const lista = el("ul", "lista hundido", ...c.map(([nombre, tecnica]) => el("li", null, nombre, tecnica ? el("span", "tecnica", ` [${tecnica}]`) : null)));
    // Una lista larga ocuparía el informe entero: plegada, y con el número a la vista
    return c.length > 5 ? el("details", null, el("summary", null, `${plural(c.length, "capacidad", "capacidades")} (mostrar la lista)`), lista)
                        : el("div", null, plural(c.length, "capacidad", "capacidades"), lista);
  }

  function firma(pe, f) {
    const s = f.datos.firma;
    if (s === null) return `${pe.firma_incrustada ? "lleva firma incrustada" : "no lleva firma incrustada"}; sin verificar (el fichero está en memoria)`;
    const firmante = s.firmante.split(",")[0].replace(/^CN=/, "").trim();  // "CN=Microsoft Windows, O=..." → "Microsoft Windows"
    const detalles = [s.tipo, firmante && `firmante: ${firmante}`].filter(Boolean).join(", ");
    const clase = s.estado === "válida" ? "limpio" : /^(ROTA|no es de confianza)/.test(s.estado) ? "alarma" : "";
    return el("span", clase, s.estado + (detalles ? ` (${detalles})` : ""));
  }

  function suplantacion(pe, f) {
    const avisos = f.datos.suplantacion;
    if (avisos.length) return el("div", "alarma", ...avisos.map((a) => el("div", null, a)));
    return f.datos.firma !== null ? el("span", "limpio", "sin indicios") : apagado("sin comprobar (no se leyó la firma: el fichero está en memoria)");
  }

  function yara(coincidencias) {
    if (coincidencias === null) return apagado("no disponible (ejecuta «argos actualiza»)");
    if (!coincidencias.length) return el("span", "limpio", "sin coincidencias");
    const lista = el("ul", "lista hundido", ...coincidencias.map(([nombre, descripcion]) => el("li", null, el("strong", null, nombre), descripcion ? ` (${descripcion})` : null)));
    return el("div", null, el("span", "alarma", plural(coincidencias.length, "regla", "reglas")), lista);
  }

  function secciones(pe) {
    const cabecera = el("tr", null, el("th", null, "Sección"), el("th", "der", "Bytes"), el("th", "der", "Entropía"), el("th", null, ""));
    const cuerpo = pe.secciones.map((s) => {
      const alta = s.entropia > ENTROPIA_ALTA;
      return el("tr", alta ? "alta" : null, el("td", null, s.nombre), el("td", "der", miles(s.bytes)), el("td", "der", s.entropia.toFixed(2)), el("td", null, alta ? "← ENTROPÍA ALTA" : null));
    });
    return el("div", "tabla-caja hundido", el("table", "tabla", el("thead", null, cabecera), el("tbody", null, ...cuerpo)));
  }

  function importaciones(pe) {
    const dlls = Object.entries(pe.importaciones);
    const total = dlls.reduce((n, [, funciones]) => n + funciones.length, 0);
    const texto = `${plural(total, "función", "funciones")} de ${plural(dlls.length, "DLL", "DLL")}`;
    if (!dlls.length) return texto;
    const lista = el("div", "lista hundido", ...dlls.map(([dll, funciones]) => el("details", null, el("summary", null, `${dll} (${funciones.length})`), el("div", "funciones", funciones.join(", ")))));
    return el("details", null, el("summary", null, `${texto} (mostrar la lista)`), lista);
  }

  const soloPE = (pintar) => (f) => (f.datos.pe === null ? noPE() : pintar(f.datos.pe, f));
  // Cada grupo del informe, y en él cada fila: deps son las partes de las que depende (se vuelve a pintar cuando llega una); pintar da su contenido.
  // filas: true = pintar da las filas enteras (el grupo «En línea» tiene una por servicio)
  const GRUPOS = [
    { titulo: "Identificación", filas: [
      { etq: "SHA-256", deps: ["identificacion"], pintar: (f) => el("span", "huella", f.datos.identificacion.sha256) },
      { etq: "SHA-1", deps: ["identificacion"], pintar: (f) => el("span", "huella", f.datos.identificacion.sha1) },
      { etq: "Tamaño", deps: ["identificacion"], pintar: (f) => tamano(f.datos.identificacion.bytes) },
      { etq: "Tipo", deps: ["identificacion"], pintar: (f) => `${f.datos.identificacion.tipo}, según Magika` },
      { etq: "Extensión", deps: ["identificacion"], pintar: (f) => {
        const i = f.datos.identificacion;
        return i.extension_engana ? el("span", "alarma", `AVISO: no corresponde al contenido (se esperaba ${i.extensiones_esperadas.map((e) => "." + e).join(", ")})`) : el("span", "limpio", "sin aviso");
      } },
      { etq: "Lista MalwareBazaar", deps: ["identificacion"], pintar: (f) => listaLocal(f.datos.identificacion.malwarebazaar, "lista del",
        el("span", "alarma", "MALWARE CONOCIDO"), el("span", "limpio", "no figura como malware conocido")) },
      // CIRCL (NSRL) recoge software publicado, no software seguro: EICAR figura porque venía en una distribución de Linux
      { etq: "Lista CIRCL", deps: ["identificacion"], pintar: (f) => listaLocal(f.datos.identificacion.circl, "descargada el",
        "software conocido; no garantiza que sea seguro (indicio: se equivoca 1 de cada 10.000)", "no figura como software conocido") },
    ] },
    { titulo: "En línea (solo sale la huella, nunca el fichero)", filas: [
      { etq: "Servicios", deps: ["en_linea"], filas: true, pintar: (f) => {
        const consultas = f.datos.en_linea;
        if (consultas === null) return [fila("Servicios", apagado("omitido (sin red)"))];
        return Object.entries(consultas).map(([servicio, r]) => fila(servicio, el("span", claseEstado(r.estado), r.detalle)));
      } },
    ] },
    { titulo: "Análisis estático", filas: [
      { etq: "Arquitectura", deps: ["pe"], pintar: soloPE((pe) => pe.arquitectura) },
      // La fecha la escribe el compilador: no es prueba de nada
      { etq: "Compilado", deps: ["pe"], pintar: soloPE((pe) => el("span", null, pe.compilado, " ", apagado("(lo escribe el compilador: puede ser falso)"))) },
      { etq: "Firma", deps: ["pe", "firma"], pintar: soloPE(firma) },
      { etq: "Suplantación", deps: ["pe", "firma", "suplantacion"], pintar: soloPE(suplantacion) },
      { etq: "Defender", deps: ["defender"], pintar: (f) => {
        const d = f.datos.defender;
        return el("span", claseEstado(d.estado) || (d.estado === "sin amenazas" ? "limpio" : ""), d.estado + (d.detalle ? ` (${d.detalle})` : ""));
      } },
      { etq: "YARA", deps: ["yara"], pintar: (f) => yara(f.datos.yara) },
      { etq: "EMBER2024", deps: ["ember"], pintar: (f) => herramienta(f.datos.ember, textoEmber) },
      { etq: "Detect It Easy", deps: ["die"], pintar: (f) => herramienta(f.datos.die, textoDie) },
      { etq: "Capacidades (capa)", deps: ["capa"], pintar: (f) => herramienta(f.datos.capa, capacidades) },
      { etq: "Secciones", deps: ["pe"], pintar: soloPE(secciones) },
      { etq: "Importaciones", deps: ["pe"], pintar: soloPE(importaciones) },
    ] },
  ];

  // --- El resumen: las señales de alarma (contadas y nombradas), lo que no se pudo comprobar y EMBER2024. NUNCA un veredicto: llega al combinar las capas ---
  function senales(f) {
    const d = f.datos;
    const alarmas = [];       // [nombre, detalle]
    const sinComprobar = [];  // textos
    const herr = (nombre, r) => {
      if (r && r.estado !== "ok" && r.estado !== "no aplica") sinComprobar.push(`${nombre}: ${r.estado}${r.detalle ? ` (${r.detalle})` : ""}`);
    };
    // MalwareBazaar es una sola señal aunque la digan la lista local y la consulta en línea: es la misma base de datos
    const enLinea = hay(f, "en_linea") ? d.en_linea : null;
    const mbLocal = hay(f, "identificacion") ? d.identificacion.malwarebazaar : undefined;
    const mbLinea = enLinea && enLinea.MalwareBazaar;
    const dondeMB = [];
    if (mbLocal && mbLocal[0]) dondeMB.push(`lista local del ${mbLocal[1]}`);
    if (mbLinea && mbLinea.estado === "malware") dondeMB.push("consulta en línea");
    if (dondeMB.length) alarmas.push(["MalwareBazaar", `malware conocido (${dondeMB.join(" y ")})`]);
    if (mbLocal === null) sinComprobar.push("lista local de MalwareBazaar: no disponible");
    if (hay(f, "identificacion") && d.identificacion.extension_engana) {
      alarmas.push(["Extensión que engaña", `no corresponde al contenido (se esperaba ${d.identificacion.extensiones_esperadas.map((e) => "." + e).join(", ")})`]);
    }
    if (hay(f, "en_linea")) {
      if (enLinea === null) sinComprobar.push("consulta en línea: omitida (sin red)");
      else for (const [servicio, r] of Object.entries(enLinea)) {
        if (r.estado === "malware") { if (servicio !== "MalwareBazaar") alarmas.push([servicio, r.detalle]); }  // CIRCL (KnownMalicious) y VirusTotal
        else if (["sin clave", "límite", "error"].includes(r.estado)) sinComprobar.push(`${servicio}: ${r.estado}`);
      }
    }
    if (hay(f, "defender")) {
      const r = d.defender;
      if (r.estado === "DETECTADO") alarmas.push(["Microsoft Defender", `DETECTADO${r.detalle ? ` (${r.detalle})` : ""}`]);
      else if (r.estado !== "sin amenazas") herr("Defender", r);
    }
    if (hay(f, "yara")) {
      if (d.yara === null) sinComprobar.push("YARA: reglas no disponibles");
      else if (d.yara.length) alarmas.push(["YARA", `${plural(d.yara.length, "regla", "reglas")}: ${d.yara.map(([nombre]) => nombre).join(", ")}`]);
    }
    if (hay(f, "suplantacion") && d.suplantacion && d.suplantacion.length) alarmas.push(["Suplantación", d.suplantacion.join("; ")]);
    if (hay(f, "pe", "firma") && d.pe !== null && d.firma === null) {
      sinComprobar.push("firma y suplantación: sin verificar (el fichero está en memoria)");
    }
    if (hay(f, "ember")) herr("EMBER2024", d.ember);
    if (hay(f, "die")) herr("Detect It Easy", d.die);
    if (hay(f, "capa")) herr("capa", d.capa);
    return { alarmas, sinComprobar };
  }

  function barraEmber(f) {
    if (!hay(f, "ember")) return el("div", "ember-fila", "EMBER2024:", pendiente());
    const r = f.datos.ember;
    if (r.estado !== "ok") return el("div", "ember-fila", "EMBER2024:", herramienta(r, textoEmber));
    const barra = el("div", "relleno");
    barra.style.width = `${Math.round(Math.max(0, Math.min(1, r.puntuacion)) * 100)}%`;
    return el("div", "ember-fila", "EMBER2024: 0", el("div", "pista-ember hundido", barra), "1",
      el("strong", null, r.puntuacion.toFixed(2).replace(".", ",")), apagado("umbral sin calibrar hasta el hito 7"));
  }

  function resumenDe(f) {
    const { alarmas, sinComprobar } = senales(f);
    const faltan = partes.filter((p) => !f.llegadas.has(p));
    return [
      alarmas.length ? el("p", "titular alarma", `Señales de alarma: ${alarmas.length}`) : el("p", "titular limpio", "Ninguna señal de alarma en lo analizado"),
      alarmas.length ? el("ul", "senales", ...alarmas.map(([nombre, detalle]) => el("li", null, el("strong", "alarma", `${nombre}: `), detalle))) : null,
      sinComprobar.length ? el("p", "apagado", "No se pudo comprobar:") : null,
      sinComprobar.length ? el("ul", "sin-comprobar apagado", ...sinComprobar.map((t) => el("li", null, t))) : null,
      barraEmber(f),
      faltan.length ? el("p", "apagado nota", `Aún pendiente…: ${faltan.map((p) => ETIQUETAS[p] || p).join(", ")}`) : null,
      el("p", "nota", "Esto solo cuenta señales: Argos todavía no las combina para decidir (hito 7)."),
    ];
  }

  // Una parte que no se pudo pintar (datos con otra forma de la esperada) no tira la página: se dice y el resto sigue
  function seguro(pintar) {
    try {
      return pintar();
    } catch (error) {
      return [apagado("no se pudo mostrar (datos inesperados)")];
    }
  }
  const nodos = (r) => [r].flat().map((x) => (x instanceof Node ? x : el("span", null, x)));

  function contarSenales(f) {
    try {
      return senales(f).alarmas.length;
    } catch (error) {
      return null;
    }
  }

  // --- Un fichero del análisis: su pestaña y su informe, que se rellena según llegan las partes ---
  function nuevoFichero(indice, nombre) {
    const f = { indice, nombre, datos: {}, llegadas: new Set(), bloques: [] };
    // El aviso amarillo del resumen: su icono (rojo, verde o gris) lo pone el CSS según el titular que haya dentro de .resumen-texto
    const textoResumen = el("div", "resumen-texto");
    f.bloques.push({ deps: null, repintar: () => textoResumen.replaceChildren(...seguro(() => resumenDe(f).filter(Boolean))) });
    const grupos = [el("div", "resumen-fichero", textoResumen)];
    for (const grupo of GRUPOS) {
      const filas = el("div", "filas");
      for (const especificacion of grupo.filas) {
        const bloque = el("div", "bloque");
        f.bloques.push({
          deps: especificacion.deps,
          repintar: () => {
            if (!hay(f, ...especificacion.deps)) return bloque.replaceChildren(fila(especificacion.etq, pendiente()));
            const hecho = seguro(() => nodos(especificacion.pintar(f)));
            bloque.replaceChildren(...(especificacion.filas ? hecho : [fila(especificacion.etq, ...hecho)]));
          },
        });
        filas.append(bloque);
      }
      grupos.push(el("fieldset", null, el("legend", null, grupo.titulo), filas));
    }
    f.panel = el("div", "informe-fichero", el("h3", "nombre-fichero", nombre), ...grupos);
    f.pestana = el("button", "pestana", nombre);
    f.pestana.type = "button";
    f.pestana.setAttribute("role", "tab");
    f.pestana.setAttribute("title", limpiar(nombre));
    f.pestana.addEventListener("click", () => seleccionar(f));
    for (const b of f.bloques) b.repintar();
    return f;
  }

  function seleccionar(elegido) {
    for (const f of ficheros) {
      if (!f) continue;
      f.panel.hidden = f !== elegido;
      f.pestana.setAttribute("aria-selected", String(f === elegido));
    }
  }

  function vaciarInforme(texto) {
    ficheros = [];
    enCurso = null;
    pestanas.replaceChildren();
    pestanas.hidden = true;
    paneles.replaceChildren(el("p", "vacio apagado", texto));
  }

  function nombreDeFichero(indice, nombre) {
    const f = nuevoFichero(indice, nombre);
    if (!ficheros.some(Boolean)) paneles.replaceChildren();  // se quita el «preparando…»
    ficheros[indice] = f;
    paneles.append(f.panel);
    // Un fichero suelto no lleva pestañas: no existen en la página hasta que llega el segundo
    const todos = ficheros.filter(Boolean);
    pestanas.replaceChildren(...(todos.length > 1 ? todos.map((x) => x.pestana) : []));
    pestanas.hidden = todos.length < 2;
    seleccionar(todos[0]);
    if (partes.length) enCurso = { fichero: f, parte: partes[0], desde: Date.now() };
    avance();
  }

  function parteHecha(indice, parte, valor) {
    const f = ficheros[indice];
    if (!f || !partes.includes(parte)) return;
    f.datos[parte] = valor;
    f.llegadas.add(parte);
    for (const b of f.bloques) if (!b.deps || b.deps.includes(parte)) b.repintar();
    const siguiente = partes[partes.indexOf(parte) + 1];
    enCurso = siguiente ? { fichero: f, parte: siguiente, desde: Date.now() } : null;
    avance();
  }

  // --- Progreso: la barra de bloques (partes hechas del fichero en curso) y lo que se está calculando con su cronómetro (capa tarda 1 o 2 minutos por ejecutable) ---
  function avance() {
    const f = ficheros.filter(Boolean).at(-1);
    relleno.style.width = partes.length && f ? `${(100 * f.llegadas.size) / partes.length}%` : "0%";
    reloj();
  }

  function reloj() {
    if (!temporizador) return;
    if (!enCurso) { actividad.textContent = ficheros.some(Boolean) ? "Un momento…" : "Preparando el análisis…"; return; }
    const s = Math.floor((Date.now() - enCurso.desde) / 1000);
    actividad.textContent = limpiar(`Analizando ${enCurso.fichero.nombre}: ${ETIQUETAS[enCurso.parte] || enCurso.parte} — ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`);
  }

  function ocupado(si) {
    for (const control of CONTROLES) control.disabled = si;
    $("avance").hidden = !si;
    document.body.classList.toggle("ocupado", si);
    if (si) {
      if (!temporizador) temporizador = setInterval(reloj, 1000);
    } else {
      clearInterval(temporizador);
      temporizador = null;
      actividad.textContent = "";
    }
  }

  // --- Actualización de datos (reglas, listas, herramientas y modelo): barra propia, sin ventanas modales ---
  let descargandoAlgo = false;

  function ocupadoActualiza(si) {
    for (const control of CONTROLES) control.disabled = si;
    actualizacion.hidden = !si;
    document.body.classList.toggle("ocupado", si);
  }

  function avanceActualiza(m) {
    const total = m.total || 0;
    const megas = (bytes) => `${(bytes / 1e6).toLocaleString("es-ES", { maximumFractionDigits: 1 })} MB`;
    switch (m.estado) {
      case "comprobando":
        descargandoAlgo = false;
        rellenoActualiza.style.width = "0%";
        actividadActualiza.textContent = "Comprobando si hay datos nuevos…";
        break;
      case "mensaje":
        actividadActualiza.textContent = limpiar(m.texto);
        break;
      case "descargando":
        descargandoAlgo = true;
        rellenoActualiza.style.width = `${total ? Math.round(100 * m.indice / total) : 0}%`;
        actividadActualiza.textContent = limpiar(`${m.nombre}: descargando ${m.tamano === null ? "(tamaño sin anunciar)" : megas(m.tamano)} (${m.motivo})`);
        break;
      case "progreso": {
        const dentro = m.tamano ? Math.min(1, m.recibidos / m.tamano) : 0;
        rellenoActualiza.style.width = `${total ? Math.round(100 * (m.indice + dentro) / total) : 0}%`;
        actividadActualiza.textContent = limpiar(`${m.nombre}: ${megas(m.recibidos)}${m.tamano ? ` de ${megas(m.tamano)}` : ""}`);
        break;
      }
      case "hecho":
        rellenoActualiza.style.width = `${total ? Math.round(100 * (m.indice + 1) / total) : 0}%`;
        actividadActualiza.textContent = limpiar(`${m.nombre}: hecho`);
        break;
      case "al_dia":
        actividadActualiza.textContent = "Todo al día.";
        break;
      case "fin":
        ocupadoActualiza(false);
        estadoBarra.textContent = descargandoAlgo ? "Actualización terminada" : "Todo al día";
        break;
      case "error":
        ocupadoActualiza(false);
        estadoBarra.textContent = "Actualización interrumpida";
        mostrarAviso("error", m.texto);
        break;
    }
    return null;
  }

  // Lo que Python manda a la página: ventana.py llama a argos.recibir(mensaje) con el mensaje serializado en JSON (un dict con "tipo")
  const recibir = (m) => {
    switch (m.tipo) {
      case "elegido":
        $("nombre").textContent = limpiar(m.nombre);
        $("tamano").textContent = tamano(m.bytes);
        $("campo-clave").hidden = !m.es_zip;
        if (!m.es_zip) clave.value = "";
        $("elegido").hidden = false;
        vaciarInforme("Pulsa «Analizar» para ver el informe de este fichero.");
        estadoBarra.textContent = "Listo";
        ocultarAviso();
        break;
      case "rechazado":
      case "aviso":
        mostrarAviso(m.tipo, m.texto);
        break;
      case "inicio":
        partes = m.partes;
        vaciarInforme("Preparando el análisis…");
        estadoBarra.textContent = "Analizando…";
        ocultarAviso();
        ocupado(true);
        avance();
        break;
      case "parte":
        if (m.parte === "nombre") nombreDeFichero(m.indice, m.valor);
        else parteHecha(m.indice, m.parte, m.valor);
        break;
      case "actualiza":
        return avanceActualiza(m);
      case "terminado": {
        ocupado(false);
        if (!ficheros.some(Boolean)) paneles.replaceChildren(el("p", "vacio apagado", "No había ningún fichero que analizar."));
        const cuentas = ficheros.filter(Boolean).map(contarSenales);
        const total = cuentas.reduce((n, c) => n + (c || 0), 0);
        estadoBarra.textContent = `Terminado: ${plural(m.ficheros, "fichero analizado", "ficheros analizados")}; ` +
          (cuentas.includes(null) ? "no se pudieron contar las señales de alarma" : total ? plural(total, "señal de alarma", "señales de alarma") : "ninguna señal de alarma");
        break;
      }
      case "error":
        enCurso = null;
        ocupado(false);
        // Un error antes del primer fichero (contraseña mala, zip roto) dejaba el informe en «Preparando el análisis…»; si ya había algo, se conserva
        if (!ficheros.some(Boolean)) vaciarInforme("No se pudo hacer el análisis: revisa el aviso y vuelve a pulsar «Analizar».");
        estadoBarra.textContent = "Análisis interrumpido";
        mostrarAviso("error", m.texto);
        break;
    }
    return null;
  };
  window.argos = Object.freeze({ recibir });

  // Hay que cancelar lo que el navegador haría por su cuenta con un fichero soltado (abrirlo en la vista, y con él la página y su CSP). La ruta del fichero
  // la recoge Python, no esta página (ventana.py, Puente._soltar): aquí solo se resalta la zona
  for (const tipo of ["dragenter", "dragover", "dragleave", "drop"]) {
    window.addEventListener(tipo, (e) => e.preventDefault());
  }
  const traeFicheros = (e) => Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes("Files");
  let profundidad = 0;  // dragenter y dragleave también saltan al pasar por los hijos de la zona
  zona.addEventListener("dragenter", (e) => { if (traeFicheros(e)) { profundidad++; zona.classList.add("sobre"); } });
  zona.addEventListener("dragover", (e) => { if (e.dataTransfer) e.dataTransfer.dropEffect = "copy"; });
  zona.addEventListener("dragleave", () => { profundidad = Math.max(0, profundidad - 1); if (!profundidad) zona.classList.remove("sobre"); });
  zona.addEventListener("drop", () => { profundidad = 0; zona.classList.remove("sobre"); });

  // La página no manda ninguna ruta: elegir() abre el diálogo de Windows desde Python y analizar() analiza el fichero que Python ya tiene elegido
  async function llamar(nombre, ...argumentos) {
    try {
      return await window.pywebview.api[nombre](...argumentos);
    } catch (error) {
      return { ok: false, motivo: "No se pudo hablar con Argos" };
    }
  }
  botonElegir.addEventListener("click", () => llamar("elegir"));
  botonActualizar.addEventListener("click", async () => {
    ocupadoActualiza(true);  // se bloquea ya; si el puente lo rechaza, se revierte
    estadoBarra.textContent = "Actualizando datos…";
    const r = await llamar("actualizar", sinCircl.checked);
    if (!r || !r.ok) {
      ocupadoActualiza(false);
      estadoBarra.textContent = "Listo";
      mostrarAviso("rechazado", (r && r.motivo) || "No se pudo actualizar");
    }
  });
  botonAnalizar.addEventListener("click", async () => {
    const r = await llamar("analizar", clave.value, sinRed.checked);
    if (!r || !r.ok) mostrarAviso("rechazado", (r && r.motivo) || "No se pudo analizar");
  });

  vaciarInforme("Elige o suelta un fichero para analizarlo: su informe aparecerá aquí.");
  // El puente (window.pywebview.api) no existe hasta que pywebview avisa con este evento
  window.addEventListener("pywebviewready", async () => {
    botonElegir.disabled = false;
    botonActualizar.disabled = false;
    try {
      pie.textContent = "Versión " + await window.pywebview.api.version();
    } catch (error) {
      pie.textContent = "Versión: no se pudo leer";
    }
  });
</script>
</body>
</html>
