[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argos"
dynamic = ["version"]
description = "Analizador local de ficheros sospechosos"
requires-python = ">=3.12"
dependencies = [
    "magika>=1.0,<2", "pyzipper>=0.4,<1", "pefile>=2024.8.26", "yara-x>=1.21,<2", "flare-capa>=9.4,<10",
    # EMBER2024 (Apache-2.0): no está en PyPI, así que va el zip de su último commit (2025-08-22), sin necesitar git
    "thrember @ https://github.com/FutureComputing4AI/EMBER2024/archive/0ef753e81d98bf209f71b03cd331dfc190b5b54d.zip",
    # thrember pide signify>=0.7.1 sin tope y con la 0.8+ no arranca (ImportError: cannot import name 'SignedPEFile' from
    # 'signify.authenticode'); la 0.7.x era la versión cuando se entrenó el modelo
    "signify>=0.7.1,<0.8",
    # La ventana (hito 5): una página local en WebView2, el motor de Edge que ya trae Windows
    "pywebview>=6.2,<7",
]

[project.scripts]
argos = "argos.__main__:main"

# gui-scripts: el .exe se crea sin consola, así que argos-ventana.exe abre solo la ventana
[project.gui-scripts]
argos-ventana = "argos.ventana:main"

[tool.setuptools.package-data]
argos = ["ventana.html"]

[tool.setuptools.dynamic]
version = { attr = "argos.__version__" }
