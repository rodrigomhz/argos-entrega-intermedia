[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argos"
dynamic = ["version"]
description = "Analizador local de ficheros sospechosos"
requires-python = ">=3.12"
dependencies = ["magika>=1.0,<2", "pyzipper>=0.4,<1", "pefile>=2024.8.26", "yara-x>=1.21,<2", "flare-capa>=9.4,<10"]

[project.scripts]
argos = "argos.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "argos.__version__" }
